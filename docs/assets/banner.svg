<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="AI Interviewer — local-first practice interviews on AI skills with evidence-grounded feedback">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1e1446"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="0.5" stop-color="#b38cff"/>
      <stop offset="1" stop-color="#ff8fc7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#c06bff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c06bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow1)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow2)"/>

  <!-- Left: title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="80" y="92" width="208" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="100" cy="108" r="5" fill="#5ee6a8"/>
    <text x="114" y="113" font-size="14" font-weight="600" fill="#cdd5ff" letter-spacing="1.5">LOCAL-FIRST · OSS</text>

    <text x="78" y="200" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">AI <tspan fill="url(#accent)">Interviewer</tspan></text>

    <text x="80" y="248" font-size="24" fill="#b8c0e0">Practice AI interviews from your terminal.</text>
    <text x="80" y="282" font-size="24" fill="#b8c0e0">Get feedback grounded in what you actually said.</text>

    <g font-size="14" font-weight="600">
      <rect x="80" y="314" width="122" height="30" rx="8" fill="#7c9cff" fill-opacity="0.15" stroke="#7c9cff" stroke-opacity="0.5"/>
      <text x="141" y="334" text-anchor="middle" fill="#aebfff">Fundamentals</text>
      <rect x="212" y="314" width="114" height="30" rx="8" fill="#b38cff" fill-opacity="0.15" stroke="#b38cff" stroke-opacity="0.5"/>
      <text x="269" y="334" text-anchor="middle" fill="#d3bcff">Building AI</text>
      <rect x="336" y="314" width="106" height="30" rx="8" fill="#ff8fc7" fill-opacity="0.15" stroke="#ff8fc7" stroke-opacity="0.5"/>
      <text x="389" y="334" text-anchor="middle" fill="#ffc1e0">Evaluation</text>
      <rect x="452" y="314" width="146" height="30" rx="8" fill="#5ee6a8" fill-opacity="0.15" stroke="#5ee6a8" stroke-opacity="0.5"/>
      <text x="525" y="334" text-anchor="middle" fill="#a8f2cf">Problem solving</text>
    </g>
  </g>

  <!-- Right: terminal window -->
  <g transform="translate(730 70)">
    <rect width="470" height="260" rx="14" fill="#0a0e1c" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect width="470" height="36" rx="14" fill="#ffffff" fill-opacity="0.05"/>
    <rect y="22" width="470" height="14" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="235" y="23" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a93b8">npm run interview</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="20" y="66" fill="#5ee6a8">Interviewer</text>
      <text x="124" y="66" fill="#d7dcf5">How would you check that an</text>
      <text x="124" y="86" fill="#d7dcf5">LLM judge is trustworthy?</text>

      <text x="20" y="118" fill="#b38cff">You</text>
      <text x="124" y="118" fill="#9aa3c7">I'd compare its scores with</text>
      <text x="124" y="138" fill="#9aa3c7">human ratings on a sample…</text>

      <!-- waveform -->
      <g fill="url(#accent)">
        <rect x="20"  y="160" width="4" height="10" rx="2"/>
        <rect x="28"  y="155" width="4" height="20" rx="2"/>
        <rect x="36"  y="150" width="4" height="30" rx="2"/>
        <rect x="44"  y="157" width="4" height="16" rx="2"/>
        <rect x="52"  y="146" width="4" height="38" rx="2"/>
        <rect x="60"  y="153" width="4" height="24" rx="2"/>
        <rect x="68"  y="159" width="4" height="12" rx="2"/>
        <rect x="76"  y="151" width="4" height="28" rx="2"/>
        <rect x="84"  y="156" width="4" height="18" rx="2"/>
        <rect x="92"  y="161" width="4" height="8"  rx="2"/>
      </g>
      <text x="124" y="170" fill="#6f7899" font-size="12">voice or text · Scribe v2 / whisper.cpp</text>

      <line x1="20" y1="196" x2="450" y2="196" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="222" fill="#7c9cff">✓</text>
      <text x="40" y="222" fill="#d7dcf5">Report saved</text>
      <text x="148" y="222" fill="#6f7899">→ report.md · report.json</text>
      <text x="20" y="244" fill="#ff8fc7">❯</text>
      <rect x="38" y="232" width="9" height="16" fill="#d7dcf5" fill-opacity="0.8"/>
    </g>
  </g>
</svg>
